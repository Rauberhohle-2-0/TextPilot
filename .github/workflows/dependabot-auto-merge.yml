name: Dependabot auto-merge

# Merges Dependabot's version bumps automatically once CI is green.
#
# GitHub Actions cannot approve pull requests here - the organization
# forbids it ("GitHub Actions is not permitted to approve pull requests"),
# and that org policy overrides the repository setting. So this workflow
# enables auto-merge directly instead of approving first; with no branch
# protection requiring reviews, a green CI run is all a merge needs.
# Restricting the job to `dependabot[bot]` means no human PR is touched.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == github.event.repository.full_name
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge (squash)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
